<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How was your week?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Прототип ОБЩЕЙ страницы /review/<код> для всех компаний HR-портала. Данные выдуманные, ничего никуда не отправляется.
  Что страница берёт из GET /api/v1/review/{code}:
    company/short ← CompanySettings.organization_name      logo   ← CompanySettings.logo_url
    hero/done     ← DriverReviewSettings.page_hero_url       accent ← DriverReviewSettings.page_accent_color
    google        ← google_review_url(CompanySettings.google_link), просим каждую неделю у всех, кто ответил
    dispatcher    ← последний диспетчер водителя в CargoETL   first_name ← Driver.first_name
    last_issue    ← что водитель отметил на прошлой неделе: pay | dispatcher | null
    lang          ← язык, который водитель выбрал в прошлый раз (en | es | ru)
  Каждый ответ сохраняется сразу по тапу (оценка из письма — при открытии страницы), кнопка внизу только закрывает опрос.
  В прототипе: ?c=<тенант>&r=1..5&last=pay|dispatcher&lang=en|es|ru
-->
<style>
  :root {
    --accent:#22262b; --ink:#16232a; --body:#36474e; --muted:#5f7076; --line:#e1e7ea; --chip:#eef2f4; --chip-ink:#22343c;
    --star:#f2b01e; --star-off:#d5dde1; --bg:#eef1f3;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); }
  body { font-family:Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--body); font-size:16px; line-height:1.45; }
  .proto { max-width:440px; margin:0 auto; padding:10px 12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted); }
  .proto b { font-weight:600; color:var(--ink); }
  .proto select { font:inherit; font-size:13px; padding:5px 8px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  .app { max-width:440px; margin:0 auto; min-height:100vh; background:#fff; position:relative; }
  .lang { position:absolute; top:12px; right:12px; z-index:3; display:flex; background:rgba(255,255,255,.92); border-radius:10px; padding:3px; box-shadow:0 1px 6px rgba(20,35,42,.15); }
  .lang button { appearance:none; border:0; background:none; font:inherit; font-size:13px; font-weight:600; color:var(--muted); padding:6px 9px; border-radius:7px; cursor:pointer; min-width:40px; }
  .lang button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .top { position:relative; height:150px; background:color-mix(in srgb, var(--accent) 12%, #fff) center 70%/cover no-repeat; }
  .top.photo::after { content:""; position:absolute; inset:auto 0 0 0; height:50px; background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.9)); }
  .top.plain { height:96px; border-bottom:3px solid var(--accent); }
  .logo { position:absolute; left:20px; bottom:-26px; z-index:2; background:#fff; border-radius:14px; padding:6px; box-shadow:0 2px 10px rgba(20,35,42,.12); display:flex; align-items:center; justify-content:center; height:60px; min-width:60px; max-width:170px; }
  .logo img { display:block; max-height:48px; max-width:158px; width:auto; height:auto; }
  .pad { padding:40px 20px 0; }
  .co { font-size:13px; font-weight:600; letter-spacing:.3px; color:var(--muted); text-transform:uppercase; }
  h1 { font-size:27px; line-height:1.15; letter-spacing:-.4px; color:var(--ink); margin:6px 0 6px; font-weight:700; }
  .sub { margin:0; color:var(--muted); font-size:15px; }
  .saved { display:flex; gap:8px; align-items:flex-start; margin:14px 0 0; padding:10px 12px; border-radius:12px; background:color-mix(in srgb, var(--accent) 8%, #fff); color:var(--ink); font-size:14px; }
  .saved::before { content:"✓"; font-weight:700; color:var(--accent); }
  .progress { display:flex; gap:6px; margin:20px 0 4px; }
  .progress i { flex:1; height:4px; border-radius:2px; background:var(--line); transition:background .25s; }
  .progress i.on { background:var(--accent); }
  .q { padding:20px 0 22px; border-bottom:1px solid var(--line); transition:opacity .2s; }
  .q.later { opacity:.38; pointer-events:none; }
  .q.follow { margin-top:18px; padding:16px; border:0; border-radius:14px; background:#fff7e6; }
  .q h2 { font-size:18px; line-height:1.3; color:var(--ink); margin:0 0 4px; font-weight:600; }
  .q .hint { margin:0 0 12px; font-size:14px; color:var(--muted); }
  .stars { display:flex; justify-content:space-between; gap:4px; margin-top:6px; }
  .star { appearance:none; border:0; background:none; padding:4px 0; flex:1; cursor:pointer; font-size:44px; line-height:1; color:var(--star-off); transition:color .12s, transform .1s; }
  .star.on { color:var(--star); }
  .star:active { transform:scale(.92); }
  .star:focus-visible, .opt:focus-visible, .lang button:focus-visible { outline:3px solid color-mix(in srgb, var(--accent) 45%, #fff); outline-offset:2px; border-radius:10px; }
  .scale { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:0 6px; }
  .opts { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; }
  .opts.two { grid-template-columns:repeat(2, minmax(0,1fr)); }
  .opts.wrap { display:flex; flex-wrap:wrap; }
  .opt { appearance:none; border:0; background:var(--chip); color:var(--chip-ink); font:inherit; font-weight:600; font-size:15px; padding:14px 6px; border-radius:12px; cursor:pointer; min-height:50px; transition:background .15s, color .15s, transform .1s; }
  .follow .opt { background:#fff; }
  .opts.wrap .opt { padding:11px 14px; min-height:44px; font-size:14px; }
  .opt:active { transform:scale(.97); }
  .opt[aria-pressed="true"] { background:var(--accent); color:#fff; }
  textarea { width:100%; min-height:96px; resize:vertical; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; font-size:16px; color:var(--ink); background:#fbfcfd; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .send { display:block; width:100%; margin:22px 0 10px; appearance:none; border:0; border-radius:14px; background:var(--accent); color:#fff; font:inherit; font-weight:600; font-size:17px; padding:16px; cursor:pointer; }
  .fine { font-size:13px; color:var(--muted); margin:0 0 32px; text-align:center; }
  .done { display:none; }
  .done .pad { padding-bottom:40px; }
  .google { margin-top:24px; padding:18px; border-radius:16px; background:#f4f6f7; }
  .google p { margin:0 0 14px; font-size:15px; }
  .gbtn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:15px; border-radius:12px; background:#fff; border:1.5px solid var(--line); color:var(--ink); font-weight:600; font-size:16px; text-decoration:none; }
  .gbtn .g { color:var(--star); font-size:18px; letter-spacing:1px; }
  .google.quiet { background:none; padding:0; margin-top:28px; }
  .google.quiet p[data-t="gText"], .google.quiet [data-t="gHelp"], .google.quiet .sugs { display:none; }
  .google.quiet .gbtn { justify-content:flex-start; border:0; padding:0; font-weight:500; font-size:14px; color:var(--muted); }
  .google.quiet .gbtn .g { font-size:13px; }
  .sugs { margin-top:8px; }
  .sugs .opt { background:#fff; border:1.5px dashed var(--line); font-weight:500; }
  .gnote { margin:10px 0 0 !important; font-size:13px !important; color:var(--muted); text-align:center; }
  .call { margin-top:22px; font-size:15px; }
  .call a { white-space:nowrap; color:var(--accent); font-weight:600; text-decoration:none; }
  .sign { margin-top:28px; font-size:14px; color:var(--muted); }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<nav class="proto" id="proto" aria-label="Prototype controls"><b>Prototype · sample data</b></nav>
<div class="app">
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="ru">RU</button>
  </div>
  <main id="form">
    <div class="top" id="top1"><div class="logo"><img id="logo1" alt=""></div></div>
    <div class="pad">
      <div class="co" id="co1"></div>
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <p class="saved" id="saved" hidden></p>

      <section class="q follow" id="follow" hidden>
        <h2 id="followQ"></h2>
        <div class="opts two">
          <button class="opt" data-f="fixed" data-t="followYes"></button>
          <button class="opt" data-f="not" data-t="followNo"></button>
        </div>
      </section>

      <div class="progress" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

      <section class="q" data-q="company">
        <h2 data-t="qCompany"></h2>
        <div class="stars" role="radiogroup" data-t-aria="rating">
          <button class="star" data-v="1">&#9733;</button><button class="star" data-v="2">&#9733;</button><button class="star" data-v="3">&#9733;</button><button class="star" data-v="4">&#9733;</button><button class="star" data-v="5">&#9733;</button>
        </div>
        <div class="scale"><span data-t="rough"></span><span data-t="great"></span></div>
      </section>

      <section class="q later" data-q="dispatcher">
        <h2 data-t="qDisp"></h2>
        <p class="hint" data-t="dispHint"></p>
        <div class="opts">
          <button class="opt" data-v="great" data-t="optGreat"></button>
          <button class="opt" data-v="okay" data-t="optOkay"></button>
          <button class="opt" data-v="bad" data-t="optBad"></button>
        </div>
      </section>

      <section class="q later" data-q="pay">
        <h2 data-t="qPay"></h2>
        <p class="hint" data-t="payHint"></p>
        <div class="opts">
          <button class="opt" data-v="always" data-t="payYes"></button>
          <button class="opt" data-v="mostly" data-t="payAlmost"></button>
          <button class="opt" data-v="late" data-t="payNo"></button>
        </div>
      </section>

      <section class="q later" data-q="fix" data-multi>
        <h2 data-t="qFix"></h2>
        <p class="hint" data-t="fixHint"></p>
        <div class="opts wrap">
          <button class="opt" data-v="rates" data-t="fRates"></button>
          <button class="opt" data-v="loads" data-t="fLoads"></button>
          <button class="opt" data-v="waiting" data-t="fWait"></button>
          <button class="opt" data-v="pay" data-t="fPay"></button>
          <button class="opt" data-v="home" data-t="fHome"></button>
          <button class="opt" data-v="paperwork" data-t="fPaper"></button>
          <button class="opt" data-v="app" data-t="fApp"></button>
          <button class="opt" data-v="nothing" data-t="fNothing"></button>
        </div>
      </section>

      <section class="q" style="border-bottom:0">
        <h2 data-t="qNote"></h2>
        <p class="hint" data-t="noteHint"></p>
        <textarea id="note" data-t-ph="notePh" data-t-aria="qNote"></textarea>
      </section>

      <button class="send" id="send" data-t="send"></button>
      <p class="fine" data-t="fine"></p>
    </div>
  </main>

  <section class="done" id="done" aria-live="polite">
    <div class="top" id="top2"><div class="logo"><img id="logo2" alt=""></div></div>
    <div class="pad">
      <div class="co" id="co2"></div>
      <h1 data-t="doneTitle"></h1>
      <p class="sub" id="doneText"></p>
      <p class="call" id="call" hidden><span data-t="call"></span> <a id="phone"></a></p>
      <div class="google" id="google" hidden>
        <p data-t="gText"></p>
        <a class="gbtn" id="glink" target="_blank" rel="noopener"><span class="g">&#9733;&#9733;&#9733;&#9733;&#9733;</span><span data-t="gBtn"></span></a>
        <p class="gnote" data-t="gHelp"></p>
        <div class="opts wrap sugs" id="sugs"></div>
        <p class="gnote" id="copied" hidden></p>
      </div>
      <div class="sign" data-t="sign"></div>
    </div>
  </section>
</div>

<script>
const T = {
  en: {
    h1: '{driver}, how was this week?', sub: "Three quick ones and you're done.",
    saved: 'Got your {n} {stars}, thanks.', star1: 'star', starN: 'stars',
    followPay: 'Last week your settlement was short. Did we fix it?', followDisp: "Last week things with dispatch weren't great. Better now?",
    followYes: 'Yes, fixed', followNo: 'Not yet', rating: 'Rating',
    qCompany: 'This week with {short}', rough: 'Rough', great: 'Great',
    qDisp: '{dispatcher}, your dispatcher, this week?', qDispNone: 'Your dispatcher this week?',
    dispHint: '{dispatcher} sees your answer.', dispHintNone: 'Your dispatcher sees your answer.',
    optGreat: 'Great', optOkay: 'Okay', optBad: 'Not great',
    qPay: 'Did your settlement come in right?', payHint: 'Right amount, on time', payYes: 'Yes', payAlmost: 'Almost', payNo: 'No',
    qFix: 'What would make next week better?', fixHint: 'Pick as many as you want',
    fRates: 'Better rates', fLoads: 'More loads', fWait: 'Less waiting', fPay: 'Faster pay', fHome: 'Home time', fPaper: 'Paperwork help', fApp: 'The app', fNothing: 'Nothing, keep it up',
    qNote: 'Anything else?', noteHint: 'Only {reader} reads this, not your dispatcher.',
    notePh: 'e.g. waited 4 hours at the dock and nobody called the broker',
    send: 'Send to {sender}', sendNone: 'Send', fine: 'Every tap is saved.',
    doneTitle: 'Thanks, {driver}', doneGood: 'Glad it was a good week.',
    doneBad: "Thanks for being straight with me. I've got it, and I'll call you by tomorrow.",
    gText: 'Can I ask a favor? Drivers look us up on Google before they call, and a few words from someone who actually runs loads with us mean more than anything we could write. Takes 30 seconds.',
    gBtn: 'Rate {short} on Google', gHelp: 'Not sure what to say? Tap one to copy it:', copied: 'Copied. Paste it in Google.',
    sugDisp: '{dispatcher} always finds me loads', sugPay: 'Paid right, every week', sugPeople: 'Good people to drive for',
    call: 'Need it sorted today? Call', sign: 'Driver team, {name}',
  },
  es: {
    h1: '{driver}, ¿cómo te fue esta semana?', sub: 'Tres preguntas rápidas y listo.',
    saved: 'Recibí tus {n} {stars}, gracias.', star1: 'estrella', starN: 'estrellas',
    followPay: 'La semana pasada tu pago llegó incompleto. ¿Lo arreglamos?', followDisp: 'La semana pasada el despacho no fue bien. ¿Mejoró?',
    followYes: 'Sí, arreglado', followNo: 'Todavía no', rating: 'Calificación',
    qCompany: 'Esta semana con {short}', rough: 'Mala', great: 'Excelente',
    qDisp: '{dispatcher}, tu despachador, ¿esta semana?', qDispNone: 'Tu despachador, ¿esta semana?',
    dispHint: '{dispatcher} verá tu respuesta.', dispHintNone: 'Tu despachador verá tu respuesta.',
    optGreat: 'Muy bien', optOkay: 'Normal', optBad: 'No muy bien',
    qPay: '¿Tu pago llegó bien?', payHint: 'Monto correcto, a tiempo', payYes: 'Sí', payAlmost: 'Casi', payNo: 'No',
    qFix: '¿Qué haría mejor la próxima semana?', fixHint: 'Elige las que quieras',
    fRates: 'Mejores tarifas', fLoads: 'Más cargas', fWait: 'Menos espera', fPay: 'Pago más rápido', fHome: 'Tiempo en casa', fPaper: 'Ayuda con papeles', fApp: 'La app', fNothing: 'Nada, sigan así',
    qNote: '¿Algo más?', noteHint: 'Solo lo lee {reader}, no tu despachador.',
    notePh: 'ej. esperé 4 horas en el muelle y nadie llamó al broker',
    send: 'Enviar a {sender}', sendNone: 'Enviar', fine: 'Cada toque se guarda.',
    doneTitle: 'Gracias, {driver}', doneGood: 'Qué bueno que fue una buena semana.',
    doneBad: 'Gracias por decírmelo claro. Ya lo tengo y te llamo a más tardar mañana.',
    gText: '¿Te puedo pedir un favor? Los conductores nos buscan en Google antes de llamar, y unas palabras de alguien que de verdad trabaja con nosotros valen más que cualquier cosa que escribamos. Son 30 segundos.',
    gBtn: 'Califica a {short} en Google', gHelp: '¿No sabes qué escribir? Toca una para copiarla:', copied: 'Copiado. Pégalo en Google.',
    sugDisp: '{dispatcher} always finds me loads', sugPay: 'Paid right, every week', sugPeople: 'Good people to drive for',
    call: '¿Hay que arreglarlo hoy? Llama al', sign: 'Equipo de conductores, {name}',
  },
  ru: {
    h1: '{driver}, как прошла неделя?', sub: 'Ещё три коротких вопроса, и всё.',
    saved: 'Твои {n} {stars} засчитаны, спасибо.', star1: 'звезда', starN: 'звезды', starMany: 'звёзд',
    followPay: 'На прошлой неделе расчёт пришёл меньше. Исправили?', followDisp: 'На прошлой неделе с диспетчером было не очень. Стало лучше?',
    followYes: 'Да, исправили', followNo: 'Пока нет', rating: 'Оценка',
    qCompany: 'Неделя с {short}', rough: 'Плохо', great: 'Отлично',
    qDisp: '{dispatcher}, твой диспетчер, как на этой неделе?', qDispNone: 'Твой диспетчер, как на этой неделе?',
    dispHint: '{dispatcher} увидит твой ответ.', dispHintNone: 'Диспетчер увидит твой ответ.',
    optGreat: 'Отлично', optOkay: 'Нормально', optBad: 'Не очень',
    qPay: 'Расчёт пришёл правильный?', payHint: 'Сумма верная, вовремя', payYes: 'Да', payAlmost: 'Почти', payNo: 'Нет',
    qFix: 'Что сделало бы следующую неделю лучше?', fixHint: 'Можно выбрать несколько',
    fRates: 'Ставки выше', fLoads: 'Больше грузов', fWait: 'Меньше ждать', fPay: 'Оплата быстрее', fHome: 'Время дома', fPaper: 'Помощь с документами', fApp: 'Приложение', fNothing: 'Ничего, так держать',
    qNote: 'Что-то ещё?', noteHint: 'Это читает только {reader}, не диспетчер.',
    notePh: 'например, ждал 4 часа на складе, и никто не позвонил брокеру',
    send: 'Отправить: {sender}', sendNone: 'Отправить', fine: 'Каждое нажатие сохраняется.',
    doneTitle: 'Спасибо, {driver}', doneGood: 'Рады, что неделя прошла хорошо.',
    doneBad: 'Спасибо за честный ответ. Он уже у меня, позвоню до завтра.',
    gText: 'Можно попросить? Водители смотрят нас в Google перед звонком, и пара слов от того, кто реально у нас возит, значит больше всего, что мы напишем сами. Секунд 30.',
    gBtn: 'Оценить {short} в Google', gHelp: 'Не знаешь, что написать? Нажми, текст скопируется (на английском, для Google):', copied: 'Скопировано. Вставь в Google.',
    sugDisp: '{dispatcher} always finds me loads', sugPay: 'Paid right, every week', sugPeople: 'Good people to drive for',
    call: 'Нужно решить сегодня? Звони', sign: 'Команда водителей, {name}',
  },
};
const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));

fetch('../companies.json', { cache: 'no-store' }).then(r => r.json()).then(list => {
  const c = list.find(x => x.id === params.get('c')) || list.find(x => x.id === 'tls');
  const V = { driver: c.sample.driver, dispatcher: c.sample.dispatcher, short: c.short, name: c.name, sender: c.sample.sender || '' };
  V.reader = V.sender || `the ${c.short} driver team`;
  let lang = T[params.get('lang')] ? params.get('lang') : 'en';
  const lastIssue = params.get('last'); // pay | dispatcher

  // Переключатели прототипа: компания и «что было на прошлой неделе»
  const sel = document.createElement('select');
  sel.setAttribute('aria-label', 'Company');
  list.forEach(x => { const o = document.createElement('option'); o.value = x.id; o.textContent = x.short; if (x.id === c.id) o.selected = true; sel.appendChild(o); });
  sel.addEventListener('change', () => { const p = new URLSearchParams(location.search); p.set('c', sel.value); location.search = p.toString(); });
  const last = document.createElement('select');
  last.setAttribute('aria-label', 'Last week');
  [['', 'last week: all fine'], ['pay', 'last week: pay off'], ['dispatcher', 'last week: dispatch bad']].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; if ((lastIssue || '') === v) o.selected = true; last.appendChild(o); });
  last.addEventListener('change', () => { const p = new URLSearchParams(location.search); last.value ? p.set('last', last.value) : p.delete('last'); location.search = p.toString(); });
  $('proto').append(sel, last);

  const asset = (path) => '../' + path;
  if (c.accent) document.documentElement.style.setProperty('--accent', c.accent);
  const paintTop = (el, img) => { if (img) { el.classList.add('photo'); el.style.backgroundImage = `url('${asset(img)}')`; } else el.classList.add('plain'); };
  paintTop($('top1'), c.hero); paintTop($('top2'), c.done || c.hero);
  ['logo1', 'logo2'].forEach(id => { $(id).src = asset(c.logo); $(id).alt = c.name; });
  $('co1').textContent = c.name; $('co2').textContent = c.name;
  if (c.google) $('glink').href = c.google;
  if (c.phone) { $('phone').href = 'tel:' + c.phone; $('phone').textContent = c.phone_text; }

  const answers = {};
  let happy = null;
  const r = parseInt(params.get('r'), 10);
  const fromEmail = r >= 1 && r <= 5;

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    document.querySelectorAll('[data-t]').forEach(el => {
      const k = el.dataset.t;
      if (k === 'qDisp' && !V.dispatcher) { el.textContent = t.qDispNone; return; }
      if (k === 'dispHint' && !V.dispatcher) { el.textContent = t.dispHintNone; return; }
      if (k === 'send' && !V.sender) { el.textContent = t.sendNone; return; }
      el.textContent = fill(t[k], V);
    });
    document.querySelectorAll('[data-t-ph]').forEach(el => el.placeholder = t[el.dataset.tPh]);
    document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t[el.dataset.tAria]));
    document.querySelectorAll('.star').forEach(b => b.setAttribute('aria-label', `${b.dataset.v}`));
    document.title = fill(t.qCompany, V);
    if (answers.company && fromEmail) {
      const n = answers.company[0];
      const word = lang === 'ru' ? (n === 1 ? t.star1 : n < 5 ? t.starN : t.starMany) : (n === 1 ? t.star1 : t.starN);
      $('saved').textContent = fill(t.saved, { n, stars: word });
    }
    if (lastIssue) $('followQ').textContent = lastIssue === 'pay' ? t.followPay : t.followDisp;
    if (happy !== null) $('doneText').textContent = happy ? t.doneGood : t.doneBad;
    // Подсказки для Google собираются из ответов водителя; текст всегда на английском — его читают в Google
    const sugs = [];
    if (V.dispatcher && (answers.dispatcher || [])[0] === 'great') sugs.push(fill(t.sugDisp, V));
    if ((answers.pay || [])[0] === 'always') sugs.push(t.sugPay);
    sugs.push(t.sugPeople);
    $('sugs').innerHTML = '';
    sugs.forEach(txt => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = '“' + txt + '”';
      b.addEventListener('click', () => { navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {}); $('copied').hidden = false; $('copied').textContent = t.copied; window.open($('glink').href, '_blank', 'noopener'); });
      $('sugs').appendChild(b); });
  }

  // Прошлая неделя: если водитель на что-то жаловался, первым спрашиваем, исправили ли
  if (lastIssue === 'pay' || lastIssue === 'dispatcher') {
    $('follow').hidden = false;
    $('follow').querySelectorAll('.opt').forEach(b => {
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => { answers.follow = [b.dataset.f]; $('follow').querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', o === b)); });
    });
  }

  const sections = [...document.querySelectorAll('.q[data-q]')];
  const bars = [...document.querySelectorAll('.progress i')];
  const has = (q) => answers[q] && answers[q].length;
  function refresh() {
    let open = true;
    sections.forEach((s, i) => { s.classList.toggle('later', !open); bars[i].classList.toggle('on', !!has(s.dataset.q)); if (!has(s.dataset.q)) open = false; });
  }
  function next(section) {
    const n = sections[sections.indexOf(section) + 1];
    if (n) setTimeout(() => n.scrollIntoView({ behavior: 'smooth', block: 'center' }), 140);
  }
  function setStars(v) {
    answers.company = [v];
    document.querySelectorAll('.star').forEach(b => { b.classList.toggle('on', +b.dataset.v <= v); b.setAttribute('aria-checked', +b.dataset.v === v); });
    refresh();
  }
  document.querySelectorAll('.star').forEach(b => { b.setAttribute('role', 'radio'); b.addEventListener('click', () => { setStars(+b.dataset.v); next(sections[0]); }); });
  sections.slice(1).forEach(s => s.querySelectorAll('.opt').forEach(b => {
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      const q = s.dataset.q;
      if (s.hasAttribute('data-multi')) {
        let cur = answers[q] || [];
        if (b.dataset.v === 'nothing') cur = cur.includes('nothing') ? [] : ['nothing'];
        else { cur = cur.filter(v => v !== 'nothing'); cur = cur.includes(b.dataset.v) ? cur.filter(v => v !== b.dataset.v) : [...cur, b.dataset.v]; }
        answers[q] = cur;
      } else { answers[q] = [b.dataset.v]; next(s); }
      s.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', (answers[q] || []).includes(o.dataset.v)));
      refresh();
    });
  }));

  // Оценка из письма сохраняется сразу при открытии страницы
  if (fromEmail) { setStars(r); $('saved').hidden = false; }
  refresh();

  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; render(); }));
  render();

  $('send').addEventListener('click', () => {
    // Можно закончить в любой момент: что успел отметить, уже сохранено.
    const stars = answers.company ? answers.company[0] : 0;
    happy = stars >= 4 && (answers.dispatcher || [''])[0] !== 'bad' && (answers.pay || [''])[0] !== 'late';
    $('form').style.display = 'none';
    $('done').style.display = 'block';
    // Google просим каждую неделю у всех, кто ответил (правила Google не разрешают звать только довольных).
    // После хорошей недели — карточка с подсказками, после плохой — тихая строка внизу.
    $('google').hidden = !c.google;
    $('google').classList.toggle('quiet', !happy);
    $('call').hidden = happy || !c.phone;
    render();
    window.scrollTo(0, 0);
  });
});
</script>
</body>
</html>
